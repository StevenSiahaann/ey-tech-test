name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Evaluation Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests (41 Tests)
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          LANGFUSE_ENABLED: "false"
          AS_OF_DATE: "2026-10-29"
        run: |
          python -m unittest discover -s backend/tests -v

      - name: Run Technical Evaluation Harness (10/10 Benchmark Scenarios)
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          LANGFUSE_ENABLED: "false"
          AS_OF_DATE: "2026-10-29"
        run: |
          python backend/eval/eval_harness.py

  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build Frontend Application (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

