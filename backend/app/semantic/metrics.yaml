# ============================================================================
# Conversational BI Metric Registry
# Business Definitions, SQL Formulas, Synonyms, and Assumptions
# ============================================================================

metrics:
  gmv:
    name: "Gross Merchandise Value (GMV)"
    description: "Total nilai kotor transaksi sebelum status pesanan diperiksa."
    sql_expression: "SUM(oi.qty * oi.unit_price - oi.discount)"
    view_field: "SUM(gmv)"
    source_view: "v_order_lines"
    unit: "currency_idr"
    synonyms:
      id: ["gmv", "nilai transaksi kotor", "total transaksi kotor", "gross merchandise value"]
      en: ["gmv", "gross merchandise value", "gross sales"]
    assumption: "GMV dihitung sebagai Σ(qty × unit_price − discount) untuk semua status pesanan."

  revenue:
    name: "Net Revenue"
    description: "Total pendapatan bersih dari pesanan yang berstatus 'Completed'."
    sql_expression: "SUM(CASE WHEN o.status = 'Completed' THEN (oi.qty * oi.unit_price - oi.discount) ELSE 0 END)"
    view_field: "SUM(revenue)"
    source_view: "v_order_lines"
    unit: "currency_idr"
    synonyms:
      id: ["revenue", "pendapatan", "omset", "omzet", "penjualan bersih"]
      en: ["revenue", "net revenue", "sales", "completed sales"]
    assumption: "Revenue hanya menghitung pesanan dengan status = 'Completed'."

  cogs:
    name: "Cost of Goods Sold (COGS)"
    description: "Total harga pokok penjualan untuk pesanan yang berstatus 'Completed'."
    sql_expression: "SUM(CASE WHEN o.status = 'Completed' THEN (oi.qty * p.unit_cost) ELSE 0 END)"
    view_field: "SUM(cogs)"
    source_view: "v_order_lines"
    unit: "currency_idr"
    synonyms:
      id: ["cogs", "hpp", "harga pokok penjualan", "biaya modal"]
      en: ["cogs", "cost of goods sold", "product cost"]
    assumption: "COGS dihitung sebagai Σ(qty × unit_cost) hanya untuk pesanan berstatus 'Completed'."

  margin:
    name: "Gross Margin"
    description: "Selisih antara Revenue dan COGS."
    sql_expression: "SUM(CASE WHEN o.status = 'Completed' THEN ((oi.qty * oi.unit_price - oi.discount) - (oi.qty * p.unit_cost)) ELSE 0 END)"
    view_field: "SUM(margin)"
    source_view: "v_order_lines"
    unit: "currency_idr"
    synonyms:
      id: ["margin", "gross margin", "keuntungan kotor", "profit kotor", "laba kotor"]
      en: ["margin", "gross margin", "gross profit"]
    assumption: "Margin dihitung sebagai Revenue − COGS untuk pesanan 'Completed'."

  cancel_rate:
    name: "Cancel Rate"
    description: "Rasio jumlah pesanan yang dibatalkan terhadap total seluruh pesanan."
    sql_expression: "ROUND((COUNT(CASE WHEN status = 'Cancelled' THEN 1 END)::numeric / NULLIF(COUNT(*), 0)::numeric) * 100, 2)"
    view_field: "cancel_rate_pct"
    source_view: "v_orders"
    unit: "percentage"
    synonyms:
      id: ["cancel rate", "tingkat pembatalan", "persentase pembatalan", "rasio cancel"]
      en: ["cancel rate", "cancellation rate", "cancelled order ratio"]
    assumption: "Cancel rate dihitung dari jumlah pesanan berstatus 'Cancelled' dibagi total pesanan dalam periode."

  order_count:
    name: "Total Orders"
    description: "Jumlah pesanan unik."
    sql_expression: "COUNT(DISTINCT order_id)"
    view_field: "COUNT(DISTINCT order_id)"
    source_view: "v_orders"
    unit: "integer"
    synonyms:
      id: ["jumlah order", "total order", "banyaknya pesanan", "jumlah transaksi"]
      en: ["order count", "total orders", "number of orders"]
    assumption: "Total pesanan dihitung dari ID pesanan unik."

  aov:
    name: "Average Order Value (AOV)"
    description: "Rata-rata nilai pendapatan bersih per pesanan yang berstatus 'Completed'."
    sql_expression: "ROUND((SUM(order_revenue)::numeric / NULLIF(SUM(is_completed), 0)::numeric), 2)"
    view_field: "aov"
    source_view: "v_orders"
    unit: "currency_idr"
    synonyms:
      id: ["aov", "average order value", "rata-rata nilai pesanan", "nilai rata-rata order", "rata-rata belanja"]
      en: ["aov", "average order value", "avg order value", "basket size"]
    assumption: "AOV dihitung sebagai Total Net Revenue dibagi jumlah pesanan Completed."

  margin_pct:
    name: "Gross Margin Percentage (%)"
    description: "Persentase Gross Margin terhadap Net Revenue untuk pesanan 'Completed'."
    sql_expression: "ROUND((SUM(margin)::numeric / NULLIF(SUM(revenue), 0)::numeric) * 100, 2)"
    view_field: "margin_pct"
    source_view: "v_order_lines"
    unit: "percentage"
    synonyms:
      id: ["margin percentage", "persentase margin", "rasio margin", "margin %", "persen margin"]
      en: ["margin percentage", "margin ratio", "gross margin %", "profit margin %"]
    assumption: "Margin % dihitung sebagai (Gross Margin / Net Revenue) × 100 untuk pesanan 'Completed'."

dimensions:
  channel:
    field: "channel"
    allowed_values: ["POS", "E-commerce", "Marketplace", "Mobile App", "Social Commerce"]
  region:
    field: "store_region"
    default_field: "store_region"
    allowed_values: ["Jawa", "Sumatera", "Kalimantan", "Sulawesi", "Bali & Nusa Tenggara"]
  city:
    field: "store_city"
  category:
    field: "product_category"
    allowed_values: ["FMCG", "Electronics", "Fashion", "Home & Living", "Health & Beauty"]
  segment:
    field: "customer_segment"
    allowed_values: ["Consumer", "Corporate", "SMB"]
  payment_method:
    field: "payment_method"
    allowed_values: ["Bank Transfer", "COD", "Cash", "Credit Card", "Debit Card", "E-Wallet"]
  status:
    field: "status"
    allowed_values: ["Completed", "Cancelled", "Returned", "Pending"]
